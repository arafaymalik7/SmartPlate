name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartplate
          POSTGRES_DB: smartplate_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartplate -d smartplate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartplate@localhost:5432/smartplate_test
      DIRECT_URL: postgresql://smartplate@localhost:5432/smartplate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:verify-seed
      - run: npm run db:verify-public-catalog
      - run: npm run db:verify-public-visibility
      - name: Prepare a disposable browser administrator
        shell: bash
        run: |
          browser_password="$(openssl rand -hex 32)"
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$browser_password"
          echo "::add-mask::$auth_secret"
          {
            echo "ADMIN_BOOTSTRAP_EMAIL=ci-admin@example.test"
            echo "ADMIN_BOOTSTRAP_PASSWORD=$browser_password"
            echo "E2E_ADMIN_EMAIL=ci-admin@example.test"
            echo "E2E_ADMIN_PASSWORD=$browser_password"
            echo "AUTH_SECRET=$auth_secret"
            echo "NEXTAUTH_SECRET=$auth_secret"
          } >> "$GITHUB_ENV"
      - run: npm run admin:bootstrap
      - name: Verify disposable administrator bootstrap
        run: npm run admin:verify-bootstrap
      - name: Verify disposable administrator password hash
        run: npm run admin:verify-password
      - name: Verify disposable administrator credentials authorization
        run: npm run admin:verify-authorizer
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: DATABASE_URL= DIRECT_URL= npm run test:e2e
      - name: Verify invalid administrator credentials
        run: npm run test:e2e:admin -- --grep "invalid credentials"
      - name: Verify valid administrator credentials
        run: npm run test:e2e:admin -- --grep "^valid credentials receive"
      - name: Verify valid administrator session
        run: npm run test:e2e:admin -- --grep "^valid credentials open"
      - name: Verify authenticated administrator lifecycle
        run: npm run test:e2e:admin -- --grep "admin UI persists"
