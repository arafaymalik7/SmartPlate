services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartplate
      POSTGRES_USER: smartplate
      POSTGRES_PASSWORD: smartplate_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplate -d smartplate"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - smartplate_pgdata:/var/lib/postgresql/data
volumes:
  smartplate_pgdata:
